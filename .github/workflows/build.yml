name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build & tandatangani APK rilis"
        type: boolean
        default: true

# Least privilege secara default; job rilis menaikkan izin hanya saat membuat GitHub Release.
permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_VERSION: "8.9"
  JAVA_VERSION: "17"
  APP_ID: com.veloris.app

jobs:
  # ---------------------------------------------------------------------------
  # 1. APK debug: berjalan di setiap push, PR, dan dispatch (tanpa secret rilis).
  # ---------------------------------------------------------------------------
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect debug APK
        id: collect
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::APK debug tidak ditemukan."
            exit 1
          fi
          mkdir -p dist
          out="dist/Veloris-debug.apk"
          cp "${apks[0]}" "$out"
          # APK adalah file zip: pastikan strukturnya utuh sebelum diunggah.
          unzip -tq "$out"
          echo "SHA-256: $(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "apk_name=$(basename "$out")" >> "$GITHUB_OUTPUT"
          echo "apk_path=$out" >> "$GITHUB_OUTPUT"

      # archive: false = file .apk diunggah apa adanya (bukan dibungkus zip).
      # Syarat upload-artifact v7: satu file per artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.apk_name }}
          path: ${{ steps.collect.outputs.apk_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. APK rilis: ditandatangani v1 + v2 + v3, diverifikasi, lalu dipublish.
  # ---------------------------------------------------------------------------
  release:
    name: Signed release APK
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.build_release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # hanya dipakai step publish GitHub Release untuk tag
    steps:
      - uses: actions/checkout@v4

      # Gagal lebih awal dan jelas bila secret penandatanganan belum diisi.
      # Nilai secret tidak pernah dicetak; hanya nama yang kosong.
      - name: Validate signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "$KS_B64" ]    || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi."; missing=1; }
          [ -n "$KS_PASS" ]   || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD belum diisi."; missing=1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::Secret ANDROID_KEY_ALIAS belum diisi."; missing=1; }
          [ -n "$KEY_PASS" ]  || { echo "::error::Secret ANDROID_KEY_PASSWORD belum diisi."; missing=1; }
          [ "$missing" -eq 0 ] || { echo "Lihat README bagian 'Signing rilis'."; exit 1; }

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/veloris-release.jks"
          printf '%s' "$KS_B64" | base64 --decode > "$ks"
          chmod 600 "$ks"
          # Path-nya saja yang masuk GITHUB_ENV; password tetap hanya di env step build.
          echo "VELORIS_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build signed release APK
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          VELORIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VELORIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VELORIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # versionCode = nomor run; wajib naik agar pembaruan bisa dipasang di atas versi lama.
          VELORIS_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature (v1 / v2 / v3) and package
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail

          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::APK rilis yang tertandatangani tidak ditemukan."
            exit 1
          fi

          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          apksigner="$bt/apksigner"
          aapt2="$bt/aapt2"

          # apksigner gagal dengan exit code non-zero bila tanda tangan rusak.
          "$apksigner" verify --verbose --print-certs "$apk" | tee signer.txt

          check_scheme() {
            if grep -Eq "Verified using $1 scheme.*: true" signer.txt; then
              echo "OK  skema $1 terverifikasi"
            else
              echo "::error::Skema $1 TIDAK terverifikasi"
              exit 1
            fi
          }
          check_scheme v1
          check_scheme v2
          check_scheme v3

          sha=$(grep -m1 'certificate SHA-256 digest' signer.txt | awk '{print tolower($NF)}')
          echo "Cert SHA-256: $sha"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
            [ "$sha" = "$expected" ] || { echo "::error::Sertifikat berbeda dari ANDROID_CERT_SHA256 (kunci rilis salah)."; exit 1; }
            echo "OK  sertifikat cocok dengan ANDROID_CERT_SHA256"
          fi

          badging=$("$aapt2" dump badging "$apk")
          pkg=$(echo "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          vname=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          vcode=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          [ "$pkg" = "$APP_ID" ] || { echo "::error::Package salah: $pkg"; exit 1; }

          echo "VERIFIED_APK=$apk" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$vname" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$vcode" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Collect release artifacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/Veloris-v${APP_VERSION_NAME}-${APP_VERSION_CODE}-release.apk"
          cp "$VERIFIED_APK" "$out"
          unzip -tq "$out"
          (cd dist && sha256sum "$(basename "$out")" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          echo "apk_name=$(basename "$out")" >> "$GITHUB_OUTPUT"
          echo "apk_path=$out" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: |
          {
            echo "## Veloris release APK"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Versi | \`${APP_VERSION_NAME}\` (code \`${APP_VERSION_CODE}\`) |"
            echo "| Skema tanda tangan | v1 ✅ · v2 ✅ · v3 ✅ |"
            echo "| SHA-256 sertifikat | \`${CERT_SHA256}\` |"
            echo "| SHA-256 APK | \`$(cut -d' ' -f1 dist/SHA256SUMS.txt)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.apk_name }}
          path: ${{ steps.collect.outputs.apk_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Veloris $tag" --generate-notes
          fi
          # Aset release = file .apk langsung (bukan zip) + checksum teks.
          gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/veloris-release.jks"
